<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas — Library</title>
    <script>
      // Apply the stored theme before first paint, otherwise a dark-mode user
      // sees a white flash while React boots. Mirrors ThemeContext's storage
      // key and resolution rules — keep the two in step.
      (function () {
        try {
          var stored = localStorage.getItem('atlas-theme');
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* no storage — fall through to light */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
